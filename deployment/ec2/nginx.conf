limit_req_zone $remote_addr zone=predicciones:10m rate=10r/s;

server {
    # Este puerto se publica solo en loopback para el túnel SSH de la defensa.
    listen 80;
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/mediflow/tls.crt;
    ssl_certificate_key /etc/mediflow/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "MediFlow EP3";
    auth_basic_user_file /etc/nginx/mediflow-usuarios;
    client_max_body_size 1m;

    location = /api/predicciones/inasistencia {
        limit_req zone=predicciones burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_read_timeout 190s;
    }
}
