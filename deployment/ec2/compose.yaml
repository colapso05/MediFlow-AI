services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediflow
      POSTGRES_DB: mediflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - datos:/var/lib/postgresql/data
      - ../../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mediflow -d mediflow]
      interval: 5s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mediflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configura RABBITMQ_PASSWORD}
    volumes:
      - cola:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 15

  inferencia:
    image: mediflow-inferencia:ep3
    build:
      context: ../..
      dockerfile: deployment/sagemaker/Dockerfile
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://mediflow:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 15

  consumidor:
    image: mediflow-inferencia:ep3
    entrypoint: [python, -m, deployment.sagemaker.eventos]
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://mediflow:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
    depends_on:
      inferencia:
        condition: service_healthy

  api:
    build: ../..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mediflow:${POSTGRES_PASSWORD}@postgres:5432/mediflow
      INFERENCIA_URL: http://inferencia:8080/invocations
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      inferencia:
        condition: service_healthy

  entrada:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8443:443'
      - '127.0.0.1:8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./privado:/etc/mediflow:ro
      - ./privado/usuarios:/etc/nginx/mediflow-usuarios:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  datos:
  cola:
